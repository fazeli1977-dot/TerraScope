<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraScope - Ramsar Eco-Watch</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 300px; background: #f8f9fa; padding: 20px; box-shadow: -2px 0 5px rgba(0,0,0,0.1); z-index: 1000; overflow-y: auto; }
        #map { flex: 1; height: 100%; }
        .ai-panel { margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 8px; border: 1px solid #90caf9; }
        .ai-panel h3 { margin-top: 0; color: #1565c0; font-size: 16px; }
        .ai-panel p { font-size: 14px; line-height: 1.6; color: #333; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>TerraScope</h2>
        <p>پلتفرم پایش تالاب‌های رامسر</p>
        <div class="ai-panel" id="ai-panel">
            <h3>🤖 تحلیل اکولوژیک (AI Engine)</h3>
            <p id="ai-content">یک تالاب را از روی نقشه انتخاب کنید...</p>
        </div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
